services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/accounts/login/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
volumes:
  app_data:

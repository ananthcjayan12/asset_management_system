{% extends "base.html" %}{% block content %}<h1 class="h3 mb-3">{{ title }}</h1><form method="post">{% csrf_token %}<div class="accordion" id="assetForm"><div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#identification">Identification and location</button></h2><div id="identification" class="accordion-collapse collapse show"><div class="accordion-body">{{ asset_form.as_p }}</div></div></div><div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#procurement">Procurement</button></h2><div id="procurement" class="accordion-collapse collapse"><div class="accordion-body">{{ procurement_form.as_p }}</div></div></div><div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#installation">Stock and installation</button></h2><div id="installation" class="accordion-collapse collapse"><div class="accordion-body">{{ installation_form.as_p }}</div></div></div></div><div class="mt-3"><button class="btn btn-primary">Save asset</button><a class="btn btn-outline-secondary" href="{% url 'assets:list' %}">Cancel</a></div></form>{% endblock %}

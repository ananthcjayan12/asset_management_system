{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">Assets</h1>{% if perms.assets.add_asset %}<a class="btn btn-primary" href="{% url 'assets:create' %}">Register asset</a>{% endif %}</div>
<div class="row g-2 mb-3"><div class="col-md-6"><input class="form-control" name="q" value="{{ q }}" placeholder="Search transaction ID, RFID code, description, serial, make or model" hx-get="{% url 'assets:list' %}" hx-trigger="keyup changed delay:350ms" hx-target="#asset-table" hx-include="[name='status'],[name='inventory_type']"></div><div class="col-md-3"><select class="form-select" name="status" hx-get="{% url 'assets:list' %}" hx-target="#asset-table" hx-include="[name='q'],[name='inventory_type']"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}" {% if status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col-md-3"><select class="form-select" name="inventory_type" aria-label="Type of inventory" hx-get="{% url 'assets:list' %}" hx-target="#asset-table" hx-include="[name='q'],[name='status']"><option value="">All inventory types</option>{% for value,label in inventory_types %}<option value="{{ value }}" {% if inventory_type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div></div>
<div id="asset-table">{% include "assets/_asset_table.html" %}</div>{% endblock %}

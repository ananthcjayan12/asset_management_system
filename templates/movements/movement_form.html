{% extends "base.html" %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">{{ title }}</h1></div>
<div class="row g-4">
  <div class="col-lg-7"><div class="card"><div class="card-body">
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">{{ submit_label|default:"Save" }}</button><a class="btn btn-outline-secondary" href="javascript:history.back()">Cancel</a></form>
  </div></div></div>
  <div class="col-lg-5"><div id="asset-summary">{% include "assets/_asset_summary.html" with asset=None %}</div></div>
</div>
{% endblock %}
